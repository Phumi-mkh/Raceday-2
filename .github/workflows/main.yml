name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore "./Raceday 2/Raceday 2.sln"
      
    - name: Build
      run: dotnet build "./Raceday 2/Raceday 2.sln" --no-restore
      
    - name: Test
      run: dotnet test "./Raceday 2/Raceday 2.sln" --no-build --verbosity normal
